<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detalle de Asignatura</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/fontawesome.css" />
  <link rel="stylesheet" href="assets/css/templatemo-scholar.css" />
  <link rel="stylesheet" href="assets/css/owl.css" />
  <link rel="stylesheet" href="assets/css/animate.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/custom-detalles.css" />
</head>

<body>
  <div id="js-preloader" class="js-preloader">
    <div class="preloader-inner">
      <span class="dot"></span>
      <div class="dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>
  <header class="header-area header-sticky">
    <div class="container mt-4">
      <div class="row">
        <div class="col-12">
          <nav class="main-nav">
            <a href="" class="logo">
              <h1>NOL</h1>
            </a>
            <ul class="nav">
              <li class="scroll-to-section">
                <a href="cerrar-sesion">Cerrar sesión</a>
              </li>
            </ul>
            <a class="menu-trigger">
              <span>Menu</span>
            </a>
            </nav>
        </div>
      </div>
    </div>
  </header>

  <div class="detalle-asignatura-section section" id="top">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <h2 id="tituloAsignatura" class="mt-3 display-5 fw-bold border-bottom pb-2 mb-4 text-center text-md-start">Cargando…</h2>
        </div>
      </div>

      <div class="row justify-content-center">
<div class="col-12">     
     <div class="student-card text-center shadow-sm p-4 mb-4">
            <div class="alumno-header mb-3">
              <img id="avatar-alumno" src="assets/images_alumnos/placeholder.jpg" alt="Avatar del alumno"
                class="alumno-avatar mb-3" />
              <h3 id="nombre-alumno" class="h4">Seleccione un alumno</h3>
            </div>
            <p id="texto-relleno" class="alumno-descripcion lead text-muted"></p>
          </div>

          <div class="navigation-controls d-flex justify-content-center align-items-center gap-3 mb-5">
            <button id="btn-anterior" class="btn btn-primary" disabled>
              <i class="fas fa-chevron-left"></i> Anterior
            </button>
            <span id="student-indicator" class="current-student-indicator"></span>
            <button id="btn-siguiente" class="btn btn-primary" disabled>
              Siguiente <i class="fas fa-chevron-right"></i>
            </button>
          </div>

          <div class="grades-card shadow-sm p-4">
            <h3 class="text-center mb-4">Calificaciones</h3>
            <ul id="lista-asignaturas" class="list-group list-group-flush"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="container">
      <div class="col-lg-12">
        <p>
          Copyright © 2025 Notas Online - Desarrollado para el curso DEW
          2024/2025-Universidad Politécnica de Valencia. Todos los derechos
          reservados para Grupo G10.
        </p>
      </div>
    </div>
  </footer>

  <script src="vendor/jquery/jquery.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.min.js"></script>
  <script src="assets/js/isotope.min.js"></script>
  <script src="assets/js/owl-carousel.js"></script>
  <script src="assets/js/counter.js"></script>
  <script src="assets/js/custom.js"></script>
  <script src="assets/js/getDetallesAsignaturas.js"></script>
</body>

</html>
